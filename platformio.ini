; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
lib_deps = 
	jgromes/RadioLib@^6.6.0
	stevemarple/MicroNMEA@^2.0.6
	asukiaaa/MPU9250_asukiaaa@^1.5.12
	jakalada/ADXL345@^0.2.0
	esphome/AsyncTCP-esphome@^1.2.2
	esphome/ESPAsyncWebServer-esphome@^2.1.0
	bblanchon/ArduinoJson@^7.1.0
	lewisxhe/XPowersLib@^0.2.6
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit SH110X@^2.1.11
	mathertel/OneButton@^2.6.1
build_flags = -DCI_BUILD -DVERSION_TAG="\"${sysenv.VERSION_TAG}\""

; ----- shared board bases -----

[esp32]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv

[esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv

[esp32s3_usb]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
build_flags = 
	${env.build_flags}
	-DTARGET_ESP32S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; ----- SX1278: 433 MHz only -----

[env:ttgo-lora32-sx1278]
extends = esp32
build_flags = ${env.build_flags} -DLORA32_SX1278 -DTARGET_ESP32 -DLORA_BAND_433

[env:ttgo-t-beam-sx1278]
extends = esp32
build_flags = ${env.build_flags} -DT_BEAM_SX1278 -DTARGET_ESP32 -DLORA_BAND_433

[env:ttgo-t3-v1_3-sx1278]
extends = esp32
build_flags = ${env.build_flags} -DT3_V1_3_SX1278 -DTARGET_ESP32 -DLORA_BAND_433

[env:ttgo-t3-v1_6-sx1278]
extends = esp32
build_flags = ${env.build_flags} -DT3_V1_6_SX1278 -DTARGET_ESP32 -DLORA_BAND_433

[env:ttgo-t3-v3_0-sx1278]
extends = esp32
build_flags = ${env.build_flags} -DT3_V3_0_SX1278 -DTARGET_ESP32 -DLORA_BAND_433

[env:ttgo-t3-s3-v1_2-sx1278]
extends = esp32s3_usb
build_flags = ${esp32s3_usb.build_flags} -DT3_S3_V1_2_SX1278 -DLORA_BAND_433

