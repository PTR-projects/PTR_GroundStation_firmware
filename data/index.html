<!DOCTYPE html>
<html>
    <head>
        <title>KPPTR</title>
        <link rel="stylesheet" href="/styles.css">
        <script>
            function POST_json(url, data) {
                return fetch(url, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(data)
                }).then(function(response) {
                    return response.json().then(function(body) {
                        return {ok: response.ok && body.ok !== false, body: body};
                    });
                });
            }

            function settingValue(setting) {
                return String(setting.value);
            }

            function toggleNestedInput(wrap, enabled) {
                var nested = wrap.querySelector(".setting-input");
                if (nested) {
                    nested.style.display = enabled ? "block" : "none";
                }
            }

            function collectSettings(root) {
                var payload = [];
                root.querySelectorAll(".setting").forEach(function(wrap) {
                    var select = wrap.querySelector("select");
                    if (!select) {
                        return;
                    }
                    var key = select.getAttribute("data-key");
                    var type = select.getAttribute("data-type");
                    var value = select.value;
                    if (type === "bool") {
                        payload.push({key: key, value: value === "true"});
                    } else {
                        payload.push({key: key, value: value});
                    }

                    var input = wrap.querySelector("input[data-key]");
                    if (input) {
                        payload.push({key: input.getAttribute("data-key"), value: input.value});
                    }
                });
                return payload;
            }

            function renderSettings(settings) {
                var root = document.getElementById("settings");
                root.innerHTML = "";

                if (!settings || settings.length === 0) {
                    root.textContent = "No settings available.";
                    return;
                }

                settings.forEach(function(setting) {
                    var wrap = document.createElement("div");
                    wrap.className = "setting";

                    var label = document.createElement("label");
                    label.setAttribute("for", "setting-" + setting.key);
                    label.textContent = setting.label;

                    var select = document.createElement("select");
                    select.id = "setting-" + setting.key;
                    select.setAttribute("data-key", setting.key);
                    select.setAttribute("data-type", setting.type || "select");

                    (setting.options || []).forEach(function(option) {
                        var item = document.createElement("option");
                        item.value = String(option.value);
                        item.textContent = option.label;
                        if (String(option.value) === settingValue(setting)) {
                            item.selected = true;
                        }
                        select.appendChild(item);
                    });

                    wrap.appendChild(label);
                    wrap.appendChild(select);

                    if (setting.input && setting.input.type === "number") {
                        var inputWrap = document.createElement("div");
                        inputWrap.className = "setting-input";

                        var input = document.createElement("input");
                        input.type = "number";
                        input.id = "setting-" + setting.input.key;
                        input.setAttribute("data-key", setting.input.key);
                        input.min = setting.input.min;
                        input.max = setting.input.max;
                        input.value = setting.input.value;
                        inputWrap.appendChild(input);
                        wrap.appendChild(inputWrap);

                        toggleNestedInput(wrap, settingValue(setting) === "true");
                        select.addEventListener("change", function() {
                            toggleNestedInput(wrap, select.value === "true");
                        });
                    }

                    root.appendChild(wrap);
                });

                var save = document.createElement("button");
                save.type = "button";
                save.className = "save-settings-button";
                save.textContent = "Save settings";
                save.addEventListener("click", saveSettings);
                root.appendChild(save);
            }

            function saveSettings() {
                var root = document.getElementById("settings");
                var payload = {settings: collectSettings(root)};
                POST_json("/settings", payload).then(function(result) {
                    if (!result.ok) {
                        window.alert((result.body && result.body.error) || "Failed to save settings");
                    }
                    return loadSettings();
                }).catch(function() {
                    window.alert("Failed to save settings");
                    loadSettings();
                });
            }

            function loadSettings() {
                return fetch("/settings")
                    .then(function(response) { return response.json(); })
                    .then(function(data) { renderSettings(data.settings); })
                    .catch(function() {
                        document.getElementById("settings").textContent = "Failed to load settings from firmware.";
                    });
            }

            document.addEventListener("DOMContentLoaded", loadSettings);
        </script>
    </head>
    <body class="settings-page">
        <input type="button" class="tracker-list-button" onclick="location.href='/tracker_list.html';" value="Tracker list"/>
        <div id="settings">Loading settings...</div>
    </body>
</html>
